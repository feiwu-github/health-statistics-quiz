<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="卫生统计学选择题练习：乱序、自动判分、正确答案与解析。">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f3f0e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="卫生统计学练习">
  <title>卫生统计学 · 选择题练习</title>
  <style>:root {
  color-scheme: light;
  --bg: #f3f0e8;
  --bg-deep: #e9e2d5;
  --card: rgba(255, 255, 255, 0.86);
  --card-solid: #fffdf8;
  --text: #1d2923;
  --muted: #69766e;
  --line: rgba(29, 41, 35, 0.12);
  --line-strong: rgba(29, 41, 35, 0.2);
  --accent: #176b52;
  --accent-2: #2e9b77;
  --accent-soft: rgba(23, 107, 82, 0.09);
  --correct: #137a52;
  --correct-bg: #e7f4ed;
  --wrong: #b13a2d;
  --wrong-bg: #fbece8;
  --shadow: 0 24px 70px rgba(40, 45, 38, 0.12);
  --shadow-soft: 0 8px 24px rgba(40, 45, 38, 0.07);
  --radius: 24px;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #101613;
    --bg-deep: #0a0f0d;
    --card: rgba(23, 32, 28, 0.9);
    --card-solid: #18211d;
    --text: #e8eee9;
    --muted: #9aa89f;
    --line: rgba(232, 238, 233, 0.13);
    --line-strong: rgba(232, 238, 233, 0.22);
    --accent: #71d3ae;
    --accent-2: #98e5c6;
    --accent-soft: rgba(113, 211, 174, 0.11);
    --correct: #83e2b9;
    --correct-bg: rgba(24, 83, 61, 0.4);
    --wrong: #ff9f8e;
    --wrong-bg: rgba(112, 40, 31, 0.42);
    --shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.2);
  }
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  background:
    radial-gradient(circle at 8% 0%, rgba(46, 155, 119, 0.16), transparent 34rem),
    radial-gradient(circle at 95% 12%, rgba(196, 152, 78, 0.12), transparent 30rem),
    linear-gradient(145deg, var(--bg), var(--bg-deep));
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: 0.32;
  background-image:
    linear-gradient(rgba(29, 41, 35, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(29, 41, 35, 0.035) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: linear-gradient(to bottom, black, transparent 78%);
  -webkit-mask-image: linear-gradient(to bottom, black, transparent 78%);
}

::selection {
  background: var(--accent);
  color: #fff;
}

.shell {
  width: min(980px, 100%);
  margin: 0 auto;
  padding: 18px 20px 28px;
}

.topbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 10px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-mark {
  flex: 0 0 auto;
  width: 40px;
  height: 40px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  color: #fff;
  background: linear-gradient(145deg, var(--accent), #0c4d3a);
  box-shadow: 0 8px 20px rgba(23, 107, 82, 0.22);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 22px;
  font-weight: 700;
}

h1 {
  margin: 0;
  font-size: clamp(17px, 1.8vw, 20px);
  line-height: 1.2;
  letter-spacing: 0.01em;
}

.brand p {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.toolbar {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 6px;
}

.btn {
  appearance: none;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 11px;
  background: var(--card);
  color: var(--text);
  font: inherit;
  font-size: 12px;
  line-height: 1.2;
  cursor: pointer;
  transition: border-color 0.18s ease, color 0.18s ease,
    background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
}

.btn:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-1px);
  box-shadow: var(--shadow-soft);
}

.btn:focus-visible,
.option:focus-visible,
.sheet-cell:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.btn:disabled {
  opacity: 0.42;
  cursor: not-allowed;
}

.btn.primary {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
  box-shadow: 0 8px 20px rgba(23, 107, 82, 0.22);
}

.btn.primary:hover:not(:disabled) {
  background: #0f5b45;
  color: #fff;
}

.btn.ghost {
  background: transparent;
}

.meta-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin: 4px 0 8px;
}

.pill {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 8px;
  background: var(--card);
  color: var(--muted);
  font-size: 10.5px;
  line-height: 1.3;
}

.pill strong {
  color: var(--accent);
  font-weight: 700;
}

.stats {
  display: flex;
  align-items: stretch;
  overflow: hidden;
  margin-bottom: 8px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--card);
  box-shadow: var(--shadow-soft);
}

.stat {
  display: flex;
  flex: 1;
  align-items: baseline;
  justify-content: center;
  min-width: 0;
  gap: 6px;
  padding: 7px 6px;
  border-left: 1px solid var(--line);
  background: transparent;
  box-shadow: none;
}

.stat:first-child {
  border-left: 0;
}

.stat span {
  display: block;
  font-size: 19px;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.stat small {
  display: block;
  margin: 0;
  color: var(--muted);
  font-size: 10px;
  white-space: nowrap;
}

.stat.correct span {
  color: var(--correct);
}

.stat.wrong span {
  color: var(--wrong);
}

.progress-track {
  height: 6px;
  margin: 0 0 10px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--line);
}

.progress-bar {
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width 0.3s ease;
}

.question-card {
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: clamp(18px, 2.6vw, 24px);
  background: var(--card);
  box-shadow: var(--shadow);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.q-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.q-index {
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.q-origin {
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 3px 7px;
  color: var(--muted);
  font-size: 10px;
  white-space: nowrap;
}

.q-text {
  margin: 0 0 18px;
  font-family: "Songti SC", "Noto Serif SC", "STSong", Georgia, serif;
  font-size: clamp(21px, 2.2vw, 25px);
  font-weight: 600;
  line-height: 1.65;
  white-space: pre-wrap;
}

.options {
  display: grid;
  gap: 8px;
}

.option {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 11px 13px;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 16px;
  line-height: 1.6;
  text-align: left;
  cursor: pointer;
  transition: border-color 0.16s ease, background 0.16s ease,
    transform 0.16s ease, box-shadow 0.16s ease;
}

.option:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--accent-soft);
  transform: translateY(-1px);
}

.option.selected {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px var(--accent);
}

.option.is-correct {
  border-color: var(--correct);
  background: var(--correct-bg);
}

.option.is-wrong {
  border-color: var(--wrong);
  background: var(--wrong-bg);
}

.option:disabled {
  cursor: default;
  opacity: 1;
}

.option-key {
  flex: 0 0 auto;
  width: 30px;
  height: 30px;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--card-solid);
  font-size: 13px;
  font-weight: 700;
}

.option.selected .option-key {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
}

.option.is-correct .option-key {
  border-color: var(--correct);
  background: var(--correct);
  color: #fff;
}

.option.is-wrong .option-key {
  border-color: var(--wrong);
  background: var(--wrong);
  color: #fff;
}

.option-text {
  padding-top: 3px;
  white-space: pre-wrap;
}

.feedback {
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 13px;
}

.feedback.correct {
  border-color: var(--correct);
  background: var(--correct-bg);
}

.feedback.wrong {
  border-color: var(--wrong);
  background: var(--wrong-bg);
}

.feedback-title {
  margin-bottom: 4px;
  font-size: 14px;
  font-weight: 700;
}

.feedback.correct .feedback-title {
  color: var(--correct);
}

.feedback.wrong .feedback-title {
  color: var(--wrong);
}

.answer-line {
  margin-top: 3px;
  font-size: 14px;
  line-height: 1.6;
}

.answer-line strong {
  color: var(--accent);
}

.explanation {
  margin-top: 6px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.65;
  white-space: pre-wrap;
}

.q-text,
.option-text,
.answer-line,
.explanation {
  overflow-wrap: anywhere;
  word-break: break-word;
}

.actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
}

.actions .spacer {
  flex: 1;
}

.hint {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}

.completion {
  padding: 26px 10px 10px;
  text-align: center;
}

.completion .mark {
  width: 76px;
  height: 76px;
  margin: 0 auto 18px;
  border: 1px solid var(--accent);
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 36px;
}

.completion h2 {
  margin: 0 0 8px;
  font-size: 26px;
}

.completion p {
  margin: 0 0 22px;
  color: var(--muted);
  line-height: 1.7;
}

.completion .actions {
  justify-content: center;
}

.foot {
  margin-top: 18px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.75;
  text-align: center;
}

.sheet {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(5, 12, 9, 0.58);
  -webkit-backdrop-filter: blur(7px);
  backdrop-filter: blur(7px);
}

.sheet[hidden] {
  display: none;
}

.sheet-panel {
  width: min(900px, 100%);
  max-height: min(82vh, 780px);
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 22px;
  background: var(--card-solid);
  box-shadow: var(--shadow);
}

.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.sheet-head h3 {
  margin: 0;
  font-size: 18px;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-bottom: 14px;
  color: var(--muted);
  font-size: 12px;
}

.legend i {
  display: inline-block;
  width: 10px;
  height: 10px;
  margin-right: 5px;
  border-radius: 3px;
  vertical-align: -1px;
}

.legend .l-correct {
  background: var(--correct);
}

.legend .l-wrong {
  background: var(--wrong);
}

.legend .l-unanswered {
  border: 1px solid var(--line-strong);
}

.sheet-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
  gap: 7px;
}

.sheet-cell {
  height: 42px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}

.sheet-cell:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.sheet-cell.correct {
  border-color: var(--correct);
  background: var(--correct-bg);
  color: var(--correct);
}

.sheet-cell.wrong {
  border-color: var(--wrong);
  background: var(--wrong-bg);
  color: var(--wrong);
}

.sheet-cell.current {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  color: var(--accent);
  font-weight: 700;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 60;
  transform: translate(-50%, 18px);
  border-radius: 999px;
  padding: 10px 16px;
  background: var(--text);
  color: var(--bg);
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (max-width: 720px) {
  .shell {
    padding: 14px 12px 24px;
  }

  .meta-strip {
    display: none;
  }

  .topbar {
    display: block;
  }

  .toolbar {
    justify-content: flex-start;
    margin-top: 8px;
  }

  .stat {
    gap: 3px;
    padding: 6px 3px;
  }

  .stat span {
    font-size: 18px;
  }

  .stat small {
    font-size: 9px;
  }

  .question-card {
    border-radius: 16px;
    padding: 16px;
  }

  .q-text {
    font-size: 19px;
  }

  .option {
    padding: 10px 11px;
  }

  .actions .hint {
    flex-basis: 100%;
  }

  .sheet {
    padding: 10px;
  }

  .sheet-panel {
    padding: 16px;
  }
}

@media (max-width: 420px) {
  .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    font-size: 21px;
  }

  .btn {
    padding: 7px 10px;
    font-size: 11.5px;
  }

  .stat {
    padding: 6px 2px;
  }

  .stat span {
    font-size: 17px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">∑</div>
        <div>
          <h1>卫生统计学 · 选择题练习</h1>
          <p>乱序练习 · 自动判分 · <span id="totalLabel">174</span> 题</p>
        </div>
      </div>
      <div class="toolbar">
        <button type="button" class="btn ghost" id="sheetBtn">答题卡</button>
        <button type="button" class="btn ghost" id="shuffleBtn">重新打乱</button>
        <button type="button" class="btn ghost" id="resetBtn">重置</button>
      </div>
    </header>

    <div class="meta-strip" aria-label="题库说明">
      <span class="pill">原题 <strong id="originalLabel">240</strong> 道</span>
      <span class="pill">保留 <strong id="totalLabelMeta">174</strong> 道</span>
      <span class="pill">未纳入 <strong id="removedLabel">66</strong> 道</span>
      <span class="pill">乱序出题</span>
      <span class="pill">仅单选</span>
    </div>

    <section class="stats" aria-label="答题统计">
      <div class="stat"><span id="statAnswered">0</span><small>已答</small></div>
      <div class="stat correct"><span id="statCorrect">0</span><small>答对</small></div>
      <div class="stat wrong"><span id="statWrong">0</span><small>答错</small></div>
      <div class="stat"><span id="statAccuracy">—</span><small>正确率</small></div>
    </section>

    <div class="progress-track" id="progressTrack" role="progressbar" aria-label="答题进度"
      aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <main class="question-card" id="questionCard" aria-live="polite">
      <p class="q-text">正在准备题库…</p>
    </main>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="答题卡">
      <div class="sheet-head">
        <h3>答题卡</h3>
        <button type="button" class="btn ghost" id="closeSheet">关闭</button>
      </div>
      <div class="legend">
        <span><i class="l-correct"></i>答对</span>
        <span><i class="l-wrong"></i>答错</span>
        <span><i class="l-unanswered"></i>未答</span>
      </div>
      <div class="sheet-grid" id="sheetGrid"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    window.__QUIZ_META__ = {
      original: 240,
      kept: 174,

  function shuffle(list) {
    const result = list.slice();
    for (let i = result.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function makeRound() {
    return shuffle(DATA).map((q) => ({
      ...q,
      selected: null,
      submitted: false,
      correct: null,
    }));
  }

  function newRound(notify) {
    state.order = makeRound();
    state.index = 0;
    state.completed = false;
    updateStats();
    render();
    if (notify) toast("已重新打乱");
  }

  function resetAnswers(notify) {
    state.order.forEach((q) => {
      q.selected = null;
      q.submitted = false;
      q.correct = null;

    state.index = 0;
    state.completed = false;
    closeSheet();
    updateStats();
    render();
    if (notify) toast("已重置本轮作答");
  }

  const answeredCount = () => state.order.filter((q) => q.submitted).length;
  const correctCount = () => state.order.filter((q) => q.submitted && q.correct).length;

  function updateStats() {
    const answered = answeredCount();
    const correct = correctCount();
    const wrong = answered - correct;
    const accuracy = answered === 0 ? "—" : `${Math.round((correct / answered) * 100)}%`;
    $("statAnswered").textContent = String(answered);
    $("statCorrect").textContent = String(correct);
    $("statWrong").textContent = String(wrong);
    $("statAccuracy").textContent = accuracy;
    const percent = TOTAL === 0 ? 0 : (answered / TOTAL) * 100;
    $("progressBar").style.width = `${percent}%`;
    $("progressTrack").setAttribute("aria-valuenow", String(Math.round(percent)));
    if (!$("sheet").hidden) renderSheet();
  }

  function optionClass(q, option) {
    const classes = ["option"];
    if (!q.submitted && q.selected === option.key) classes.push("selected");
    if (q.submitted) {
      if (option.key === q.answer) classes.push("is-correct");
      else if (option.key === q.selected) classes.push("is-wrong");
    }
    return classes.join(" ");
  }

  function render() {
    if (state.completed) {
      renderCompletion();
      return;
    }
    const q = state.order[state.index];
    if (!q) return;

    const options = q.options.map((o) => `
      <button type="button" class="${optionClass(q, o)}" data-key="${esc(o.key)}"
        aria-pressed="${q.selected === o.key}" ${q.submitted ? "disabled" : ""}>
        <span class="option-key">${esc(o.key)}</span>
        <span class="option-text">${pretty(o.text)}</span>
      </button>`).join("");

    let feedback = "";
    if (q.submitted) {
      const correctOption = q.options.find((o) => o.key === q.answer);
      const answerText = correctOption ? `${q.answer}. ${correctOption.text}` : q.answer;
      const explanation = q.explanation
        ? `<div class="explanation">解析：${pretty(q.explanation)}</div>`
        : "";
      feedback = `
        <div class="feedback ${q.correct ? "correct" : "wrong"}" role="status">
          <div class="feedback-title">${q.correct ? "✓ 回答正确" : "✗ 回答错误"}</div>
          <div class="answer-line">正确答案：<strong>${pretty(answerText)}</strong></div>
          ${explanation}
        </div>`;
    }

    const actions = q.submitted
      ? `<button type="button" class="btn primary" id="nextBtn">${state.index === TOTAL - 1 ? "查看答题卡" : "下一题"}</button>
         <button type="button" class="btn ghost" id="prevBtn" ${state.index === 0 ? "disabled" : ""}>上一题</button>
         <span class="spacer"></span>
         <span class="hint">答对 ${correctCount()} / 已答 ${answeredCount()} 题</span>`
      : `<button type="button" class="btn primary" id="submitBtn" ${q.selected ? "" : "disabled"}>提交答案</button>
         <button type="button" class="btn ghost" id="prevBtn" ${state.index === 0 ? "disabled" : ""}>上一题</button>
         <span class="spacer"></span>
         <span class="hint">快捷键：A–E / 1–5 选择，Enter 提交</span>`;

    $("questionCard").innerHTML = `
      <div class="q-head">
        <span class="q-index">第 ${state.index + 1} / ${TOTAL} 题</span>
        <span class="q-origin">${esc(q.sourceLabel)} #${q.sourceNum}</span>
      </div>
      <p class="q-text">${pretty(q.q)}</p>
      <div class="options" role="group" aria-label="选项">${options}</div>
      ${feedback}
      <div class="actions">${actions}</div>`;

    $("questionCard").querySelectorAll(".option").forEach((button) => {
      button.addEventListener("click", () => choose(button.dataset.key));
    });
    if ($("submitBtn")) $("submitBtn").addEventListener("click", submit);
    if ($("nextBtn")) $("nextBtn").addEventListener("click", next);
    if ($("prevBtn")) $("prevBtn").addEventListener("click", previous);
  }

  function choose(key) {
    const q = state.order[state.index];
    if (!q || q.submitted) return;
    q.selected = key;
    $("questionCard").querySelectorAll(".option").forEach((button) => {
      const active = button.dataset.key === key;
      button.classList.toggle("selected", active);
      button.setAttribute("aria-pressed", String(active));
    });
    if ($("submitBtn")) $("submitBtn").disabled = false;
  }

  function submit() {
    const q = state.order[state.index];
    if (!q || q.submitted || !q.selected) return;
    q.submitted = true;
    q.correct = q.selected === q.answer;
    updateStats();
    render();
  }

  function next() {
    if (state.completed) return;
    if (state.index < TOTAL - 1) {
      state.index += 1;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    if (answeredCount() < TOTAL) {
      openSheet();
      toast(`还有 ${TOTAL - answeredCount()} 题未答`);
      return;
    }
    state.completed = true;
    updateStats();
    render();
  }

  function previous() {
    if (state.completed) {
      state.completed = false;
      state.index = TOTAL - 1;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    if (state.index > 0) {
      state.index -= 1;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  }

  function renderCompletion() {
    const answered = answeredCount();
    const correct = correctCount();
    const accuracy = answered === 0 ? 0 : Math.round((correct / answered) * 100);
    $("questionCard").innerHTML = `
      <div class="completion">
        <div class="mark">✓</div>
        <h2>本轮完成</h2>
        <p>已答 ${answered} / ${TOTAL} 题 · 答对 ${correct} 题 · 正确率 ${accuracy}%</p>
        <div class="actions">
          <button type="button" class="btn primary" id="againBtn">重新打乱再来一轮</button>
          <button type="button" class="btn ghost" id="reviewBtn">查看答题卡</button>
          <button type="button" class="btn ghost" id="lastBtn">回到最后一题</button>
        </div>
      </div>`;
    $("againBtn").addEventListener("click", () => {
      if (confirm("重新打乱会清空本轮作答，继续？")) newRound(true);
    });
    $("reviewBtn").addEventListener("click", openSheet);
    $("lastBtn").addEventListener("click", () => {
      state.completed = false;
      state.index = TOTAL - 1;
      render();
    });
  }

  function renderSheet() {
    $("sheetGrid").innerHTML = state.order.map((q, i) => {
      const classes = ["sheet-cell"];
      if (q.submitted && q.correct) classes.push("correct");
      if (q.submitted && !q.correct) classes.push("wrong");
      if (!state.completed && i === state.index) classes.push("current");
      return `<button type="button" class="${classes.join(" ")}" data-index="${i}"
        aria-label="第 ${i + 1} 题${q.submitted ? (q.correct ? "，答对" : "，答错") : "，未答"}"
        aria-current="${!state.completed && i === state.index ? "true" : "false"}">${i + 1}</button>`;
    }).join("");

    $("sheetGrid").querySelectorAll(".sheet-cell").forEach((button) => {
      button.addEventListener("click", () => {
        state.index = Number(button.dataset.index);
        state.completed = false;
        closeSheet();
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
  }

  function openSheet() {
    renderSheet();
    $("sheet").hidden = false;
    document.body.style.overflow = "hidden";
  }

  function closeSheet() {
    $("sheet").hidden = true;
    document.body.style.overflow = "";
  }

  let toastTimer = 0;
  function toast(message) {
    const node = $("toast");
    node.textContent = message;
    node.classList.add("show");
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => node.classList.remove("show"), 1800);
  }

  function confirmReset() {
    if (answeredCount() > 0 && !confirm("清空本轮作答？")) return;
    resetAnswers(true);
  }

  function confirmShuffle() {
    if (answeredCount() > 0 && !confirm("重新打乱会清空本轮作答，继续？")) return;
    newRound(true);
  }

  function bindChrome() {
    $("sheetBtn").addEventListener("click", openSheet);
    $("closeSheet").addEventListener("click", closeSheet);
    $("shuffleBtn").addEventListener("click", confirmShuffle);
    $("resetBtn").addEventListener("click", confirmReset);
    $("sheet").addEventListener("click", (event) => {
      if (event.target === $("sheet")) closeSheet();
    });

    document.addEventListener("keydown", (event) => {
      if (!$("sheet").hidden) {
        if (event.key === "Escape") closeSheet();
        return;
      }
      if (event.target instanceof HTMLElement &&
          ["INPUT", "TEXTAREA", "SELECT"].includes(event.target.tagName)) return;
      if (event.key === "Enter" && event.target instanceof HTMLElement &&
          event.target.closest("button")) return;
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        previous();
        return;
      }
      if (event.key === "ArrowRight") {
        event.preventDefault();
        next();
        return;
      }
      if (event.key === "Enter") {
        event.preventDefault();
        const q = state.order[state.index];
        if (q && q.submitted) next();
        else submit();
        return;
      }
      const numeric = { "1": "A", "2": "B", "3": "C", "4": "D", "5": "E" };
      const key = numeric[event.key] || (/^[a-eA-E]$/.test(event.key) ? event.key.toUpperCase() : null);
      if (key) {
        event.preventDefault();
        choose(key);
      }
    });
  }

  function init() {
    if (TOTAL === 0) {
      $("questionCard").textContent = "题库为空。";
      return;
    }
    $("totalLabel").textContent = String(TOTAL);
    $("totalLabelMeta").textContent = String(TOTAL);
    $("removedLabel").textContent = String(META.removed || 0);
    $("originalLabel").textContent = String(META.original || 0);
    bindChrome();
    newRound(false);
    updateStats();
  }

  init();
})();
</script>
</body>
</html>
